apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-mongo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gridirontest.com/modules/argocd-demo.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: user-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
