apiVersion: v1
kind: Secret
metadata:
  name: argocd-private-repo-cred
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/The-Icon-debug/argocd-k8s.git
  username: "<your gitlab username>"
  password: "<project-level token>"
  insecure: "true"
